<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Background (Soft warm cream color for a cozy food vibe) -->
  <rect width="100" height="100" rx="20" fill="#FFFAF0" />
  
  <!-- Border (Subtle to define the edges on any browser theme) -->
  <rect x="2" y="2" width="96" height="96" rx="18" fill="none" stroke="#F0D9C0" stroke-width="2" />

  <!-- Magic Sparkles (Signifies "Food Picker" randomness) -->
  <path d="M 72 25 L 73 30 L 78 31 L 73 32 L 72 37 L 71 32 L 66 31 L 71 30 Z" fill="#FFD166" />
  <path d="M 25 25 L 26 28 L 29 29 L 26 30 L 25 33 L 24 30 L 21 29 L 24 28 Z" fill="#FFD166" />
  <path d="M 78 55 L 79 58 L 82 59 L 79 60 L 78 63 L 77 60 L 74 59 L 77 58 Z" fill="#FFD166" />

  <!-- Body / Shirt -->
  <path d="M 32 80 C 30 90 40 100 50 100 C 60 100 70 90 68 80 Z" fill="#FFAAA5" />
  
  <!-- Shirt Collar Detail -->
  <path d="M 42 78 L 50 84 L 58 78" fill="none" stroke="#E05A5A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Neck -->
  <rect x="45" y="60" width="10" height="15" fill="#FFC8A2" />

  <!-- Hair (Back layer) -->
  <path d="M 34 45 C 30 20 70 20 66 45 C 65 55 60 65 55 68 C 55 55 45 55 45 68 C 40 65 35 55 34 45 Z" fill="#4A2E2B" />

  <!-- Face -->
  <ellipse cx="50" cy="50" rx="16" ry="18" fill="#FFE0BD" />

  <!-- Bangs (Hair Front) -->
  <path d="M 34 46 C 32 25 68 25 66 46 C 63 40 59 38 55 36 C 60 33 62 28 60 26 C 55 34 50 37 45 37 C 40 34 38 30 35 28 C 33 30 38 35 40 37 C 36 39 34 42 34 46 Z" fill="#4A2E2B" />

  <!-- Headband (Cute hair accessory) -->
  <path d="M 34 38 Q 50 28 66 38" fill="none" stroke="#FF6B6B" stroke-width="3" stroke-linecap="round" />

  <!-- Glasses -->
  <circle cx="42" cy="50" r="7" fill="none" stroke="#2C1B18" stroke-width="2.5" />
  <circle cx="58" cy="50" r="7" fill="none" stroke="#2C1B18" stroke-width="2.5" />
  <!-- Glasses Bridge -->
  <path d="M 49 50 L 51 50" stroke="#2C1B18" stroke-width="2.5" stroke-linecap="round" />
  <!-- Glasses Temples (Arms) -->
  <path d="M 35 50 L 33 48" stroke="#2C1B18" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 65 50 L 67 48" stroke="#2C1B18" stroke-width="2.5" stroke-linecap="round" />

  <!-- Eyes -->
  <circle cx="42" cy="50" r="2" fill="#2C1B18" />
  <circle cx="58" cy="50" r="2" fill="#2C1B18" />
  <!-- Eye Catchlights -->
  <circle cx="42.5" cy="49" r="0.8" fill="#FFFFFF" />
  <circle cx="58.5" cy="49" r="0.8" fill="#FFFFFF" />

  <!-- Blush -->
  <ellipse cx="36" cy="56" rx="3" ry="2" fill="#FF9E9E" opacity="0.6" />
  <ellipse cx="64" cy="56" rx="3" ry="2" fill="#FF9E9E" opacity="0.6" />

  <!-- Smile -->
  <path d="M 45 57 Q 50 62 55 57" fill="none" stroke="#2C1B18" stroke-width="2" stroke-linecap="round" />

  <!-- Boba Tea -->
  <!-- Straw -->
  <path d="M 50 68 L 58 52 L 61 53 L 53 70 Z" fill="#FF6B6B" />
  
  <!-- Cup Lid -->
  <rect x="38" y="68" width="24" height="5" rx="2" fill="#E8EFF4" />
  
  <!-- Cup Body -->
  <path d="M 40 73 L 60 73 L 56 92 C 55 96 45 96 44 92 Z" fill="#FAFAFA" opacity="0.95" />
  
  <!-- Milk Tea Liquid -->
  <path d="M 42 80 L 58 80 L 57 92 C 56 95 44 95 43 92 Z" fill="#D1A37A" />
  
  <!-- Sealing Film / Top of Liquid -->
  <path d="M 42 80 L 58 80" stroke="#B07A4E" stroke-width="1" stroke-linecap="round" />
  
  <!-- Boba Bubbles (Tapioca Pearls) -->
  <circle cx="48" cy="86" r="2.5" fill="#3A2318" />
  <circle cx="53" cy="89" r="2.5" fill="#3A2318" />
  <circle cx="45" cy="89" r="2.5" fill="#3A2318" />
  <circle cx="51" cy="84" r="2.5" fill="#3A2318" />

  <!-- Hands holding the cup -->
  <circle cx="39" cy="82" r="4.5" fill="#FFE0BD" />
  <circle cx="61" cy="82" r="4.5" fill="#FFE0BD" />
  
  <!-- Finger hints -->
  <path d="M 36 84 Q 36 82 38 82" fill="none" stroke="#E5A782" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 64 84 Q 64 82 62 82" fill="none" stroke="#E5A782" stroke-width="1.5" stroke-linecap="round" />
</svg>