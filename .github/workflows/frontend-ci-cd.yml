name: Frontend CI/CD

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json
      - name: Install dependencies
        working-directory: Frontend
        run: npm ci

      # Uncomment if you have tests; otherwise, this step will fail if no test script exists.
      # If you have no tests yet, comment it out or add a dummy test.
      # - name: Run tests
      #   working-directory: frontend
      #   run: npm test -- --watchAll=false

      - name: Build
        working-directory: Frontend
        run: npm run build
